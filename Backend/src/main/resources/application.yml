spring:
  application:
    name: ecommerce-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER:ecommerce_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholders:
      admin_password_hash: ${ADMIN_PASSWORD_HASH}   # không default — thiếu env (profile local/test không nạp) → fail-fast (D-1-08)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme_redis}   # default dev đồng bộ với docker-compose (D-0-10)
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: false   # field lạ trong body bị bỏ qua (vd: role khi register — 3.3 phase-1)

server:
  port: 8080

# Cấu hình ứng dụng — Phase 1
app:
  jwt:
    secret: ${JWT_SECRET}   # không default — thiếu env (profile local/test không nạp) → fail-fast (D-1-09)

# Spring Boot Actuator — chỉ expose /actuator/health (không expose info, metrics, ...)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never   # không lộ chi tiết DB/Redis connection ra ngoài

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
